<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mg-utils — live demo</title>
    <meta name="description" content="Malagasy number words and Madagascar phone numbers, live." />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfaf7;
        --fg: #1d1c1a;
        --muted: #6b675f;
        --line: #e4e0d7;
        --accent: #0f6b4f;
        --error: #b3261e;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161614;
          --fg: #ecebe6;
          --muted: #a19d93;
          --line: #34322e;
          --accent: #5cc9a0;
          --error: #f2a49d;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.5;
      }
      main {
        max-width: 44rem;
        margin: 0 auto;
        padding: 3rem 1.25rem 4rem;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.25rem;
      }
      .lead {
        color: var(--muted);
        margin: 0 0 2.5rem;
      }
      section {
        border-top: 1px solid var(--line);
        padding: 1.75rem 0;
      }
      h2 {
        font-size: 1.05rem;
        margin: 0 0 0.75rem;
      }
      label {
        display: block;
        font-size: 0.875rem;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        font-size: 1.125rem;
        padding: 0.6rem 0.75rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
      }
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      output {
        display: block;
        margin-top: 0.9rem;
        font-size: 1.25rem;
        min-height: 1.9rem;
        overflow-wrap: anywhere;
      }
      output.error {
        color: var(--error);
        font-size: 1rem;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.25rem 1rem;
        margin: 0.9rem 0 0;
        font-size: 1rem;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.9em;
      }
      footer {
        color: var(--muted);
        font-size: 0.875rem;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>mg-utils</h1>
      <p class="lead">
        Malagasy number words and Madagascar phone numbers, running the published packages in your
        browser.
      </p>

      <section>
        <h2>Number → Malagasy words</h2>
        <label for="number">A whole number from 0 to 999 999 999 999</label>
        <input id="number" inputmode="numeric" autocomplete="off" value="2026" />
        <output id="words" for="number" aria-live="polite"></output>
      </section>

      <section>
        <h2>Phone number</h2>
        <label for="phone">A Malagasy mobile number, written any way</label>
        <input id="phone" inputmode="tel" autocomplete="off" value="034 12 345 67" />
        <output id="phone-error" for="phone" class="error" aria-live="polite"></output>
        <dl id="phone-result" hidden>
          <dt>Operator</dt>
          <dd id="operator"></dd>
          <dt>National</dt>
          <dd><code id="national"></code></dd>
          <dt>International</dt>
          <dd><code id="international"></code></dd>
          <dt>E.164</dt>
          <dd><code id="e164"></code></dd>
        </dl>
      </section>

      <footer>
        <p>
          <code>npm install @madagascar-oss/words @madagascar-oss/phone</code> ·
          <a href="https://github.com/madagascar-oss/mg-utils">Source, rules and data sources</a>
        </p>
      </footer>
    </main>

    <script type="module">
      import { numberToWords } from './lib/words.js';
      import { OPERATOR_NAMES, formatPhoneNumber, safeParsePhoneNumber } from './lib/phone.js';

      const numberInput = document.getElementById('number');
      const wordsOutput = document.getElementById('words');
      const phoneInput = document.getElementById('phone');
      const phoneError = document.getElementById('phone-error');
      const phoneResult = document.getElementById('phone-result');

      const MESSAGES = {
        INVALID_TYPE: 'Type a whole number.',
        OUT_OF_RANGE: 'Use a number from 0 to 999 999 999 999.',
        INVALID_FORMAT: 'This is not a Malagasy number. Try 034 12 345 67.',
        UNKNOWN_OPERATOR: 'This prefix is not assigned to a mobile operator.',
      };

      function showWords() {
        const text = numberInput.value.replace(/[\s_]/g, '');
        if (text === '') {
          wordsOutput.textContent = '';
          return;
        }
        try {
          wordsOutput.textContent = numberToWords(/^\d+$/.test(text) ? Number(text) : NaN);
          wordsOutput.className = '';
        } catch (error) {
          wordsOutput.textContent = MESSAGES[error.code] ?? error.message;
          wordsOutput.className = 'error';
        }
      }

      function showPhone() {
        const input = phoneInput.value;
        const result = safeParsePhoneNumber(input);
        phoneResult.hidden = !result.success;
        phoneError.textContent =
          result.success || input.trim() === '' ? '' : MESSAGES[result.error.code];
        if (!result.success) return;
        document.getElementById('operator').textContent = OPERATOR_NAMES[result.data.operator];
        document.getElementById('national').textContent = formatPhoneNumber(input, 'national');
        document.getElementById('international').textContent = formatPhoneNumber(
          input,
          'international',
        );
        document.getElementById('e164').textContent = result.data.e164;
      }

      numberInput.addEventListener('input', showWords);
      phoneInput.addEventListener('input', showPhone);
      showWords();
      showPhone();
    </script>
  </body>
</html>
