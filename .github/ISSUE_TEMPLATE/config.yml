blank_issues_enabled: false
contact_links:
  - name: Wrong data, new helper, new module or new language
    url: https://github.com/mdgascar/mdg-utils-spec/issues/new/choose
    about: Data and behaviour are decided in the spec first.
  - name: Question or idea
    url: https://github.com/mdgascar/mdg-utils-js/discussions
    about: Ask questions and discuss ideas in Discussions, so issues stay for actionable work.
  - name: Security vulnerability
    url: https://github.com/mdgascar/mdg-utils-js/security/advisories/new
    about: Report security issues privately, never in a public issue.
