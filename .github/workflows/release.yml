name: Release

# dev: Changesets keeps a "chore: release packages" PR open against dev that bumps versions
#      and writes changelogs.
# main: merging dev into main publishes every version not yet on npm, tags it and creates
#       the GitHub release. Merging dev into main is the only release action.
on:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Version PR
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the changeset-release/dev branch
      pull-requests: write # open or update the Version PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          commit-message: 'chore: release packages'
          pr-title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # tags and GitHub releases
      id-token: write # npm trusted publishing + provenance, no token on any laptop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Refuse to publish unversioned changes
        run: |
          pending=$(find .changeset -name '*.md' ! -name README.md | wc -l)
          if [ "$pending" -gt 0 ]; then
            echo "::error::$pending pending changeset(s) on main. Merge the 'chore: release packages' PR into dev, then merge dev into main again."
            exit 1
          fi
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
