name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: madagascar-oss/.github/.github/workflows/reusable-lint.yml@main

  js-lint:
    name: Format + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - name: Public API unchanged (run `just api` and commit etc/ if intended)
        run: pnpm build && pnpm -r --filter "./packages/*" exec api-extractor run

  spec:
    name: Codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup
      - run: pnpm codegen
      - name: Generated code matches spec/
        run: git diff --exit-code -- 'packages/*/src/generated' || (echo "::error::Generated code is out of date. Run 'just codegen' and commit." && exit 1)

  test-js:
    name: Spec vectors (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Maintained Node.js LTS lines: https://nodejs.org/en/about/previous-releases
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm test
      - run: pnpm build
      - run: pnpm spec-claim
